plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.aivle'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

def testcontainersVersion = '2.0.5'
def awsSdkVersion = '2.47.3'

dependencies {
	implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:url-connection-client'
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.bouncycastle:bcprov-jdk18on:1.83'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.apache.poi:poi-ooxml:5.5.1'
	implementation 'com.github.librepdf:openpdf:1.3.39'
	implementation 'org.apache.commons:commons-compress:1.28.0'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation "org.testcontainers:testcontainers-junit-jupiter:${testcontainersVersion}"
	testImplementation "org.testcontainers:testcontainers-postgresql:${testcontainersVersion}"
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'postgres', 'minio'
	}
	// 테스트 클래스 128개 중 `@SpringBootTest` 는 18개뿐이고 나머지는 순수 단위 테스트다
	// (postgres·minio 태그 8개는 위에서 빠진다). 단일 포크로 줄 세울 이유가 없다.
	//
	// ⚠ 포크마다 JVM 이 따로라 **Spring 컨텍스트 캐시도 따로**다. 포크를 늘릴수록
	//   컨텍스트를 다시 짓는 값이 붙으므로 코어 수만큼 올리면 오히려 느려진다.
	//   4 는 「단위 테스트를 갈라 태우되 컨텍스트 재구축은 4벌까지만」의 타협이다.
	maxParallelForks = Math.min(4, Runtime.runtime.availableProcessors().intdiv(2)) ?: 1
	maxHeapSize = '1g'
}

tasks.register('postgresTest', Test) {
	description = 'Runs PostgreSQL Testcontainers integration tests.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'postgres'
	}
	shouldRunAfter tasks.named('test')
}

tasks.register('minioTest', Test) {
	description = 'Runs S3-compatible integration tests against MinIO.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'minio'
	}
	shouldRunAfter tasks.named('test')
}
