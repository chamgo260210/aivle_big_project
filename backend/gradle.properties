# 이 파일은 2026-08-14 까지 **빈 파일**이었다 — 빌드 캐시도 병렬도 꺼진 채였고
# 그래서 `clean test build bootJar` 가 매번 11분을 다 썼다.
#
# ⚠ 인코딩은 건드리지 않는다. gradle/Java 로그는 CP949 이고, 여기서 file.encoding 을
#   UTF-8 로 밀면 `Get-Content` 판독이 통째로 갈린다 (루트 CLAUDE.md 「환경 지뢰」).

# 바뀌지 않은 입력은 다시 굽지 않는다. `clean` 을 빼야 효과가 있다 —
# `clean` 은 산출물을 지워 캐시 조회조차 못 하게 만든다.
org.gradle.caching=true

# 단일 모듈이라 이득은 작지만, test/compile 과 무관한 태스크가 겹칠 때 붙는다.
org.gradle.parallel=true

# 기본 힙(512m)으로는 Spring 컨텍스트를 여러 포크에 띄울 때 데몬이 먼저 죽는다.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
