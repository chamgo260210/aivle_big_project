server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/v2/jobs/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }

    # 해시가 붙은 산출물이라 내용이 바뀌면 이름이 바뀐다 — 오래 캐시해도 낡을 수 없다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ⚠ index.html 은 **캐시하지 않는다.** 이름이 고정인데 안에 든 asset 해시가 매 배포마다
    #   바뀌기 때문이다. Cache-Control 이 없으면 브라우저가 Last-Modified 로 임의 추정 캐시를
    #   하고, 그러면 배포를 해도 옛 index.html → 옛 JS 를 계속 꺼내 쓴다.
    #   실측(2026-08-11): 컨테이너에는 새 번들뿐인데 화면은 옛 화면이 나왔다. 서버는 옳고
    #   브라우저가 낡은 것이라, 「코드가 배포됐나」를 아무리 확인해도 원인이 안 보인다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
