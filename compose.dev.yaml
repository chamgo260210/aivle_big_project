# 개발용 겹침(override) 파일. **혼자 뜨지 않는다** — compose.yaml 위에 얹는다.
#
#   docker compose -f compose.yaml -f compose.dev.yaml up -d
#
# 여기서 없애려는 것은 딱 둘이다.
#   1. `ai/` 를 한 줄 고칠 때마다 이미지를 다시 굽는 것 (바인드 + --reload)
#   2. backend 를 호스트에서 못 치는 것 (포트 공개)
#
# ⚠ 이 파일은 **로컬 전용**이다. compose.yaml 이 정본이고, 여기 있는 것을 거기로 옮기지 않는다 —
#   바인드 마운트는 이미지가 자립하지 못하게 만들고, 그 함정은 예전에 한 번 밟았다
#   (compose.yaml 의 RESEARCH2_HOME 주석 참고).

services:
  ai-server:
    # 소스를 굽지 않고 붙인다. compose 는 volumes 목록을 **대상 경로 기준으로 병합**하므로
    # compose.yaml 의 runs/·runs-generated/·bank/ 마운트는 그대로 살아 있다.
    environment:
      # 공용 구조화 프롬프트 경로(재무·시장 인터뷰·법률·여정)의 응답을 녹화해 두고
      # 다음부터 공짜로 재생한다. **fixture 가 아니다** — 처음 한 번은 진짜로 호출하고,
      # 프롬프트나 모델이 바뀌면 키가 달라져 다시 호출한다.
      # 결정론이 필요하면 `AI_REPLAY_MODE=replay` (없으면 돈 쓰는 대신 실패한다).
      AI_REPLAY_DIR: ${AI_REPLAY_DIR:-/app/replays}
      AI_REPLAY_MODE: ${AI_REPLAY_MODE:-auto}
      # 시장 인터뷰 응답 원장. **여기에만 켠다** — 운영은 꺼진 채로 둔다(`ledger.py` 규율 1).
      #
      # 이 배선이 없어서 실제로 진단을 못 했다. 「40명이 다 같은 말을 한다」가 응답 탓인지
      # 코딩 탓인지 가르려면 원문이 있어야 하는데, 원장은 코드에만 있고 어느 실행 설정에도
      # 안 붙어 있어 **유료로 돌려도 원문이 안 남았다.** 그래서 그 질문에 답하려면 매번
      # 유료 1판을 다시 써야 했고, 결국 한 번도 안 쟀다.
      #
      # 원장이 있으면 `python -m app.tools.recode_ledger <원장> --stored` 가 **0원**이다.
      MARKET_INTERVIEW_LEDGER_DIR: ${MARKET_INTERVIEW_LEDGER_DIR:-/app/ledgers/market-interview}
    volumes:
      - ./ai/app:/app/app
      - ./ai/main.py:/app/main.py:ro
      # 녹화는 컨테이너 밖에 남는다 — 재기동마다 증발하면 아무 이득이 없다.
      - ./ai/replays:/app/replays
      # 원장도 마찬가지다. `.gitignore` 가 이 경로를 이미 빼 두고 있다 —
      # 응답 원문이라 커밋하지 않는다.
      - ./ai/ledgers/market-interview:/app/ledgers/market-interview
    # ⚠ --reload 대상을 좁히지 않으면 232MB 측정 원장(runs/)과 10.8MB 카드 뱅크를
    #   전부 감시해 CPU 를 통째로 먹고, 원장 파일이 하나 바뀔 때마다 서버가 재기동한다.
    command:
      - uvicorn
      - main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
      - --reload-exclude
      - "*/research2/runs/*"
      - --reload-exclude
      - "*/research2/runs-generated/*"
      - --reload-exclude
      - "*/twin/bank/*"

  backend:
    # compose.yaml 은 backend 포트를 호스트에 열지 않는다. 그래서 스모크도 디버깅도
    # 전부 nginx(:3000) 를 경유해야 했다. 개발 중에는 직접 친다.
    ports:
      - "${BACKEND_PORT:-8080}:8080"
